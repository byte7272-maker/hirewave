# coturn config for the peer practice-interview TURN relay.
#
# The shared secret is NOT stored here — it is passed on the command line from
# ${TURN_SECRET} in your .env (see docker-compose.yml `coturn` service), so the
# API and coturn share one source of truth and the secret never lands in a file
# that might get committed. Everything below is static, non-sensitive config.

# REST/time-limited credentials: the API mints username="<expiry>:<user>" and
# credential=base64(HMAC-SHA1(secret, username)); coturn validates it with the
# same secret. No standing usernames/passwords exist.
use-auth-secret

# Must match JOBSEARCH_TURN_REALM used by the API's credential minting context.
realm=hirewave.local

# Listeners. TLS is off here for a simple LAN/dev relay; for the public internet
# add a cert and switch to turns: (see the commented block at the bottom).
listening-port=3478
no-tls
no-dtls

# Relay port range coturn hands out for media. Keep it modest and make sure these
# UDP ports are reachable (published in compose or opened on the host firewall).
min-port=49160
max-port=49200

# Behind NAT (almost always, in the cloud/home), coturn must advertise the
# PUBLIC address it's reachable at, or clients will get unroutable candidates.
# Uncomment and set to your host's public IP (or use `external-ip=PUB/PRIV`):
# external-ip=203.0.113.10

# Hygiene / hardening.
fingerprint
no-multicast-peers
no-cli
stale-nonce=600
# Don't relay to the box's own loopback/LAN admin ranges.
denied-peer-ip=127.0.0.1
denied-peer-ip=::1

# --- Production TLS (turns:) ------------------------------------------------
# Get a cert (e.g. Let's Encrypt) for your TURN hostname, mount it, then replace
# the `no-tls`/`no-dtls` lines above with:
#   tls-listening-port=5349
#   cert=/etc/coturn/certs/fullchain.pem
#   pkey=/etc/coturn/certs/privkey.pem
# and set JOBSEARCH_TURN_URLS to the turns: URL so all relay traffic is encrypted.
