[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobsearch"
version = "0.1.0"
description = "Core engines for the Job-Search Automation Platform (integration, generation, matching, verification, automation)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Bayete" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "cryptography>=42.0",
    "tzdata>=2024.1",  # IANA tz database for zoneinfo (Windows / slim images)
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pyjwt>=2.8", "python-multipart>=0.0.9"]
db = ["sqlalchemy>=2.0"]
documents = ["pypdf>=4.0", "python-docx>=1.1"]  # text extraction from uploaded PDF/DOCX
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
automation = ["playwright>=1.44"]
firebase = ["firebase-admin>=6.5"]  # verify Firebase ID tokens (live sign-in)
reminders = ["pywebpush>=2.0"]  # web-push reminders (optional channel)
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
