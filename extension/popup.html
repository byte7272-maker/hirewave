<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light dark; }
    body { width: 320px; margin: 0; font: 14px/1.4 system-ui, sans-serif; padding: 14px; }
    h1 { font-size: 15px; margin: 0 0 2px; }
    p.sub { margin: 0 0 12px; color: #666; font-size: 12px; }
    label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 3px; }
    input, select { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #ccc;
      border-radius: 6px; font-size: 13px; background: transparent; }
    button { width: 100%; margin-top: 14px; padding: 9px; border: 0; border-radius: 6px;
      background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    .status { margin-top: 12px; font-size: 12px; min-height: 16px; }
    .ok { color: #16a34a; } .err { color: #dc2626; } .muted { color: #666; }
    details { margin-top: 10px; } summary { font-size: 12px; color: #666; cursor: pointer; }
    .note { font-size: 11px; color: #888; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Connect to Hirewave</h1>
  <p class="sub">Captures your login session — cookies only, never your password.</p>

  <label for="provider">Job site</label>
  <select id="provider">
    <option value="linkedin">LinkedIn</option>
    <option value="indeed">Indeed</option>
    <option value="glassdoor">Glassdoor</option>
    <option value="greenhouse">Greenhouse</option>
    <option value="workday">Workday</option>
    <option value="ziprecruiter">ZipRecruiter</option>
    <option value="dice">Dice</option>
  </select>

  <label for="code">Pairing code (from Hirewave's Connect dialog)</label>
  <input id="code" type="text" placeholder="paste the code" autocomplete="off" />

  <label for="label">Label (optional)</label>
  <input id="label" type="text" placeholder="e.g. your email — to recognize this account" autocomplete="off" />

  <button id="connect">Connect this site</button>
  <div id="status" class="status muted"></div>

  <details>
    <summary>Advanced</summary>
    <label for="apiBase">Hirewave API base URL</label>
    <input id="apiBase" type="text" autocomplete="off" />
  </details>

  <p class="note">Make sure you're logged into the site in this browser first.</p>

  <script src="popup.js"></script>
</body>
</html>
